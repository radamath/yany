services:
  yany-relay:
    image: ghcr.io/radamath/yany-relay:latest
    restart: unless-stopped
    ports:
      - "6568:6568"
    volumes:
      - yany-tls:/data/tls
    environment:
      YANY_RELAY_BIND: 0.0.0.0:6568
      YANY_JOIN_TOKEN_FILE: /data/tls/join.token
      RUST_LOG: info

volumes:
  yany-tls:
